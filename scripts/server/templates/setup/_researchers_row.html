{# Partial: a single researcher row. Server-rendered for the HTMX add-row case.
   The initial-render rows are inlined in step_researchers.html. #}
<fieldset class="topics-row">
  <label>name <input type="text" name="name_{{ idx }}" value="{{ r.name }}"></label>
  <label>affiliation <input type="text" name="affiliation_{{ idx }}" value="{{ r.affiliation }}"></label>
  <label>orcid <input type="text" name="orcid_{{ idx }}" value="{{ r.orcid }}" placeholder="0000-0000-0000-0000"></label>
  <label>scopus_id <input type="text" name="scopus_id_{{ idx }}" value="{{ r.scopus_id }}"></label>
  <label>notes <textarea name="notes_{{ idx }}" rows="2">{{ r.notes }}</textarea></label>
  <button type="button" class="button danger"
    onclick="this.closest('fieldset').remove()">Remove</button>
</fieldset>
