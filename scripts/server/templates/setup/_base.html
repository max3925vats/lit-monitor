{% extends "base.html" %}
{% block title %}Setup — lit-monitor{% endblock %}
{% block content %}
<section class="wizard">
  <div class="wizard-strip" aria-label="Setup progress">
    {% for n in range(1, 9) %}
      <span class="step
        {% if current_step is defined and n == current_step %}current{% endif %}
        {% if current_step is defined and n < current_step %}done{% endif %}
      ">{{ n }}</span>
    {% endfor %}
  </div>
  <div class="wizard-body">
    {% block step_content %}{% endblock %}
  </div>
</section>
{% endblock %}
