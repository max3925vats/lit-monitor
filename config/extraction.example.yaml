# extraction.example.yaml — reference template for extraction.yaml.
#
# Copy to extraction.yaml and edit for your local setup.
# See extraction.yaml for the full brain_build / embeddings / reranker options.

# ---------------------------------------------------------------------------
# Bundle F — embedding provider abstraction
# Controls which embedding model/provider is used for ChromaDB vector indices.
# WARNING: changing provider or model on an existing installation requires a
# full collection rebuild (`lit-monitor embeddings switch` or `rebuild`).
# ChromaDB collections are dimension-locked — vectors from different models
# cannot coexist in the same collection.
# ---------------------------------------------------------------------------
embedding:
  # Active provider: 'ollama' (default, local) or 'litellm' (cloud/API)
  provider: ollama

  ollama:
    # Local Ollama server URL.
    host: http://localhost:11434
    # Model for vector embeddings.  Default 1024-dim.
    # Alternative: nomic-embed-text (768-dim, smaller + faster).
    model: mxbai-embed-large
    dim: 1024

  litellm:
    # Any LiteLLM-compatible embedding model.
    # Provider is inferred from the model string (e.g. 'text-embedding-3-large'
    # routes to OpenAI; 'cohere/embed-english-v3.0' routes to Cohere).
    # API keys are read from environment variables per LiteLLM docs.
    # Requires: uv sync --extra litellm
    model: text-embedding-3-large
    dim: 3072

# ---------------------------------------------------------------------------
# Bundle A — context-aware ranking core
# All keys default to "off" so existing pipelines are unaffected on upgrade.
# ---------------------------------------------------------------------------
ranking:
  weights:
    # Additive score contribution from domain_context paragraph.
    # 0.0 = today's behavior (no domain_context contribution).
    # Set to 0.2–0.5 once you have a well-written domain_context.yaml.
    domain_context: 0.0
    # Bundle C: additive weight for max-cosine-to-nearest-centroid signal.
    # 0.0 (default) = no cluster signal; today's behavior preserved on upgrade.
    # Recommended: 0.1–0.3 once clusters have been computed and validated.
    cluster_centroid: 0.0
    # Bundle D: graph-in-ranker signals (weighted sum, NOT RRF).
    # All default to 0.0 — no behavior change until you opt in.
    # entity_overlap: bonus for shared MENTIONS entities between candidate and library.
    #   normalized: min(n_shared_entities / 5, 1.0). Try 0.1–0.2.
    graph_entity_overlap: 0.0
    # citation: bonus when candidate cites library papers (or is cited by them),
    #   or EXTENDS/COMPARES_TO library papers.
    #   normalized: min(citation_total / 3, 1.0). Try 0.1–0.2.
    graph_citation: 0.0
    # shared_authors: bonus for shared author names (case-insensitive, deduped).
    #   normalized: min(n_shared_authors / 3, 1.0). Try 0.05–0.15.
    graph_shared_authors: 0.0

  domain_filter:
    # Set true to enable the pre-rank semantic filter.
    # Candidates below the threshold cosine are moved to the off-domain pool.
    # The soft floor (minimum_off_domain_slots_pct) always preserves some
    # off-domain candidates for serendipitous discovery.
    enabled: false
    # Cosine similarity cutoff.  Candidates below this → off-domain pool.
    threshold: 0.35
    # Fraction of digest slots always reserved for off-domain candidates.
    # ⌈digest_size × this⌉ slots are taken from the highest-scoring off-domain papers.
    # Default 0.05 = 5% of 20 = 1 slot guaranteed for serendipity.
    minimum_off_domain_slots_pct: 0.05

  s2_supplement_cap:
    # Set true to drop Semantic Scholar supplemented candidates with low
    # relevance_score (as returned by the S2 API search endpoint).
    enabled: false
    # Candidates with relevance_score below this threshold are dropped.
    min_relevance: 0.4

# ---------------------------------------------------------------------------
# G1 — Graph RAG retrieval settings (Phase 1)
# Install the [graph] extra first: uv sync --extra graph
# ---------------------------------------------------------------------------
retrieval:
  default_mode: vector          # "vector" | "graph" | "hybrid"
  graph_db:
    persist_dir: "~/.config/lit-monitor/graph.kuzu"

# ---------------------------------------------------------------------------
# N1 (Phase 2): BioBERT NER + cloud-Ollama long-tail.
# Optional — requires `uv sync --extra nlp`.
# ---------------------------------------------------------------------------
graph:
  ner:
    # Pinned default. Swap by setting your own HuggingFace model id.
    model: alvaroalon2/biobert_genetic_ner
    # auto | mps | cuda | cpu.  'auto' picks MPS > CUDA > CPU.
    device: auto
    # Set true to enable cloud-Ollama long-tail validation (N2). Requires OLLAMA_API_KEY.
    cloud_long_tail_enabled: false
    # Cloud model used when cloud_long_tail_enabled=true. Requires OLLAMA_API_KEY.
    cloud_model: gemma2:27b-cloud
    # Cloud Ollama endpoint.
    cloud_host: https://ollama.com
    # Batch size for NER inference. 16 is conservative; bump on big GPUs.
    batch_size: 16
  relationships:
    # R4 (Phase 3): enable LLM relationship extraction during ingest.
    # Requires OLLAMA_API_KEY.  Single cloud-Ollama call per paper, produces
    # typed triples across 8 LLM-emitted predicates (EXTENDS, CONTRADICTS,
    # COMPARES_TO + the 5 Paper→Entity ones).  Augmentation, not replacement —
    # G4 schema-source extraction still runs first.
    llm_enabled: false
    # Cloud model used when llm_enabled=true.
    cloud_model: gemma2:27b-cloud

# ---------------------------------------------------------------------------
# P2 — OS notification on discovery completion.
# Requires the [notify] extra: uv sync --extra notify
# ---------------------------------------------------------------------------
discovery:
  notify:
    enabled: true                # set false for headless/server installs
    on_zero_results: false       # suppress notification when no new papers
    min_papers_to_notify: 1      # placeholder for future filtering (P4)
    preferred_viewer: ""         # set by P4 wizard or notify-handler: browser|obsidian|none
    asked_user: false            # true once the P4 chooser page has been shown
  notes:
    # P10: set false to skip the inline note write during ingest and batch-render
    # later via `lit-monitor obsidian sync --all`.  Default true preserves
    # existing behavior — notes are written immediately on paper ingest.
    auto_write_per_paper: true
  digest:
    # P10b: set false to skip the inline digest .md write at the end of each
    # discovery run.  Default true preserves existing behavior.
    # When false, use `lit-monitor discovery export-md --run latest` to render.
    auto_write: true

    # ---------------------------------------------------------------------------
    # Bundle B — score decomposition in the Markdown digest
    # ---------------------------------------------------------------------------
    score_decomposition:
      # Set true to render a compact per-signal breakdown table after each paper's
      # rationale in the Top Results section of the .md digest.
      # Default false — preserves v0.8 / Bundle A digest format unchanged.
      show_in_md: false
      # The web UI /discovery paper cards always show the "Why this paper?" panel
      # (native <details> element, default open). Set false to hide it.
      show_in_web_ui: true

# ---------------------------------------------------------------------------
# Bundle C — theme-clustered library centroids
# Gated by min_papers_threshold: below that count the feature is a graceful
# no-op and existing vector-only behaviour is preserved.
# ---------------------------------------------------------------------------
clustering:
  # Master switch. When false the whole feature is disabled (no-op on upgrade).
  enabled: true
  # Library must have at least this many indexed papers before clustering runs.
  # Below the threshold: feature is silently skipped.
  min_papers_threshold: 100
  # k-means K search range; silhouette score selects the best K in this window.
  k_min: 5
  k_max: 15
  # How often to recompute clusters. Informational — used by nightly scheduler.
  recompute_frequency: nightly

  # Tier-3 opt-in: use existing named Zotero collections as cluster seeds.
  # When enabled, papers already in the listed collections bias k-means init.
  use_existing_collections_as_priors:
    enabled: false               # disabled by default
    collection_names: []         # e.g. ["Chromatography", "Filtration"]

  # Write-back: all disabled by default. Opt in tier-by-tier.
  write_back:
    # Tier-1: add lm/<theme-name> tags to Zotero items for each cluster.
    # Run: lit-monitor cluster write-back tags --confirm  (--dry-run is default)
    tags:
      enabled: false             # set true to enable automatic write-back after recompute
      namespace: lm              # tag prefix: lm/<theme-name>

    # Tier-2: create Zotero sub-collections under parent_collection for each theme.
    # Run: lit-monitor cluster write-back collections --confirm
    collections:
      enabled: false             # set true to enable automatic write-back after recompute
      parent_collection: lit-monitor  # top-level collection created if absent
