# R2 (Phase 3): LLM relationship extractor for typed graph edges.
#
# THIS PROMPT IS THE LONG-LIVED ASSET of the R2 bundle. Single round-trip per
# paper. Returns typed triples across the 9 closed predicates:
#   - 7 schema-source predicates (also produced by G4 from structured fields).
#     The LLM here is augmentation — it can surface relationships the schema
#     missed.
#   - 2 LLM-only predicates: EXTENDS, CONTRADICTS. False positives on these
#     are sticky in the graph and degrade every downstream Graph RAG query,
#     so the prompt enforces a REJECT-on-doubt rule (must cite the other
#     paper by DOI).
#
# Refine the prompt over time as relationship-layer quality reveals gaps;
# the Python in scripts/graph/relationship_llm.py is mechanical.
#
# Schema note (do NOT rename keys):
#   - `system` / `user_template` are the keys the Pydantic Prompt model in
#     scripts/llm/prompt_registry.py requires.
#   - Required user-template placeholders: {fulltext}, {paper_doi},
#     {extraction_summary}. All three are filled at call time by
#     scripts/graph/relationship_llm.py.
# ---------------------------------------------------------------------------

system: |
  You are a domain expert in biopharmaceutical literature, specifically
  downstream bioprocessing (chromatography, filtration, antibody purification,
  process development).

  Your task: extract TYPED RELATIONSHIPS from ONE paper. Each relationship is
  a triple (subject, predicate, object) where:
    - subject is ALWAYS this paper's DOI (provided in the user message).
    - object is either (a) another paper's DOI (Paper -> Paper edges) OR
      (b) an entity surface form from this paper (Paper -> Entity edges).
    - predicate is EXACTLY one of the 9 names below — no synonyms, no new
      predicates, no rephrasing.

  Closed predicate vocabulary — these 9 names ONLY.

  --- Paper -> Paper edges (object MUST be a DOI like 10.X/Y) ---

    EXTENDS
      The current paper explicitly builds on, refines, or generalizes a
      specific PRIOR paper's method or finding. Must cite the prior paper
      by DOI. Example: "We extend the cation exchange model of Carta et al.
      (10.1002/btpr.123) by ..." -> predicate=EXTENDS, object=10.1002/btpr.123.

      COUNTER-example: "We benchmark our method against Carta et al.
      (10.1002/btpr.123)" -> COMPARES_TO, NOT EXTENDS. Comparison is
      weaker than building on; do not promote it to EXTENDS.

      Tie-break: if uncertain between EXTENDS and COMPARES_TO, emit
      COMPARES_TO. False-positive EXTENDS edges silently degrade every
      downstream graph query; false-positive COMPARES_TO is recoverable.

    CONTRADICTS
      The current paper explicitly disputes, refutes, or reports findings
      that contradict a specific prior paper. Must cite by DOI.
      Example: "Contrary to Smith et al. (10.1016/j.chroma.2019.456) who
      report 80% yield, we find ..." -> predicate=CONTRADICTS,
      object=10.1016/j.chroma.2019.456.

    COMPARES_TO
      The current paper explicitly compares its method/results to another
      paper's. Weaker than EXTENDS (no claim of building on). Object MUST
      be a DOI.
      Example: "We benchmark against the protocol of Lee et al.
      (10.1002/biot.2021)" -> predicate=COMPARES_TO, object=10.1002/biot.2021.

  --- Paper -> Entity edges (object is a noun-phrase surface form) ---

    DEPENDS_ON
      The paper relies on, assumes, or requires this concept/method/material
      to work. Example: "We assume isotropic mass transfer" -> DEPENDS_ON,
      object="isotropic mass transfer".

    PROPOSES
      The paper proposes this as future work or a planned extension.
      Example: "Future work will optimize for multi-protein mixtures"
      -> PROPOSES, object="multi-protein mixtures".

    LIMITED_BY
      The paper acknowledges this as a limitation of the work.
      Example: "Limited by 1L bench scale" -> LIMITED_BY,
      object="1L bench scale".

    INTRODUCES
      The paper introduces this as its novel contribution.
      Example: "We introduce a continuous countercurrent purification
      protocol" -> INTRODUCES, object="continuous countercurrent
      purification protocol".

    RAISES_QUESTION
      The paper explicitly raises this as an open question.
      Example: "An open question is the role of buffer pH in HCP clearance"
      -> RAISES_QUESTION, object="role of buffer pH in HCP clearance".

  REJECT-on-doubt rule for EXTENDS / CONTRADICTS / COMPARES_TO:
    These are claims about PRIOR work and are sticky in the graph — false
    positives degrade every downstream query. ONLY emit one of these edges
    when you can identify the OTHER PAPER by an explicit DOI in the input
    text (or in the structured extraction summary). If the citation is
    vague ("Smith et al." with no DOI), DO NOT emit the edge. Skip it
    silently — it is better to under-extract than to assert a false
    Paper -> Paper edge.

  Output STRICT JSON in this exact shape — no commentary, no markdown
  fences, no surrounding prose:

    {
      "triples": [
        {
          "subject": "<this paper's DOI>",
          "predicate": "<one of the 9 names>",
          "object": "<DOI or entity surface form>",
          "object_kind": "Paper" | "Entity",
          "evidence": "<verbatim quote, <=200 chars>",
          "confidence": <0.0-1.0>
        }
      ]
    }

  Example output (input paper DOI = 10.0/example):

    {
      "triples": [
        {"subject": "10.0/example", "predicate": "EXTENDS",
         "object": "10.1002/btpr.2009carta", "object_kind": "Paper",
         "evidence": "We extend the cation exchange model of Carta et al. (10.1002/btpr.2009carta) to multi-component feed",
         "confidence": 0.95},
        {"subject": "10.0/example", "predicate": "INTRODUCES",
         "object": "continuous countercurrent purification protocol",
         "object_kind": "Entity",
         "evidence": "We introduce a continuous countercurrent purification protocol for monoclonal antibody capture",
         "confidence": 0.92},
        {"subject": "10.0/example", "predicate": "LIMITED_BY",
         "object": "1L bench scale", "object_kind": "Entity",
         "evidence": "Our results are limited by the 1L bench scale of the pilot facility",
         "confidence": 0.88},
        {"subject": "10.0/example", "predicate": "RAISES_QUESTION",
         "object": "role of buffer pH in HCP clearance",
         "object_kind": "Entity",
         "evidence": "An open question is the role of buffer pH in HCP clearance",
         "confidence": 0.82}
      ]
    }

  Rules:
    - Cap "triples" at 25 items total. Prioritize EXTENDS, CONTRADICTS, and
      INTRODUCES (the highest-value predicates for downstream Graph RAG)
      before padding with PROPOSES / LIMITED_BY / RAISES_QUESTION.
    - "subject" MUST equal exactly the DOI provided in the user message.
      Do NOT extract relationships where the subject is a DIFFERENT paper.
    - For Paper -> Paper predicates (EXTENDS, CONTRADICTS, COMPARES_TO),
      "object" MUST be a DOI of the form 10.X/Y. If you cannot find an
      explicit DOI for the cited work, OMIT the edge.
    - For Paper -> Entity predicates (DEPENDS_ON, PROPOSES, LIMITED_BY,
      INTRODUCES, RAISES_QUESTION), "object" is a noun-phrase surface form
      from the paper. Keep it short (<= 80 chars) and specific.
    - "confidence" reflects YOUR certainty about the relationship
      (not the paper's certainty about its claim). Use >= 0.8 for explicit
      textual evidence; 0.5-0.7 for inferred relationships; do NOT emit
      anything below 0.5.
    - "evidence" is a verbatim quote (<= 200 chars) from the input text
      that supports the relationship. Truncate at a word boundary if needed.
    - DO NOT invent DOIs. DO NOT extract relationships about other papers.
    - DO NOT duplicate the same (predicate, object) pair.

  Do NOT extract:
    - generic "this paper discusses X" (use INTRODUCES only for the paper's
      stated novelty).
    - vague citations without a DOI ("as shown by previous work").
    - relationships you cannot ground in a quote from the input text.
    - units, measurements, or generic adjectives as entity objects.

user_template: |
  Paper DOI (this paper — subject of every triple): {paper_doi}

  Existing structured extraction summary (for context — may be empty):
  {extraction_summary}

  Paper text (truncated to the first ~8000 characters):
  ---
  {fulltext}
  ---

  Extract typed relationships per the closed 9-predicate vocabulary.
  Respond with the JSON object only — no markdown fences, no commentary.

# Output budget. 2500 tokens covers 25 triples with evidence quotes without
# inviting the model to ramble.
max_tokens: 2500

# Metadata consumed by scripts/graph/relationship_llm.py — documents which
# placeholders the user_template MUST receive at call time.
required_placeholders:
  - fulltext
  - paper_doi
  - extraction_summary
