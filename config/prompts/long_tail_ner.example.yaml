# N2 (Phase 2): Cloud-Ollama long-tail NER + low-confidence validation.
#
# THIS PROMPT IS THE LONG-LIVED ASSET of the N2 bundle. Single round-trip per
# paper. Returns NEW entities BioBERT missed AND validations (keep/reject) for
# BioBERT's low-confidence spans. Refine over time as entity-layer quality
# reveals gaps; bump prompt_version in extraction.yaml::graph.ner so re-extraction
# is selective.
#
# Schema note (do NOT rename keys):
#   - `system` / `user_template` are the keys the Pydantic Prompt model in
#     scripts/llm/prompt_registry.py requires. The fields below ALSO live in the
#     wider model's `extra: allow` bucket, so adding metadata (e.g.
#     `required_placeholders`) is safe.
#   - Required user-template placeholders are {text} and {low_conf_json}. Both
#     are filled at call time by scripts/graph/long_tail.py.
# ---------------------------------------------------------------------------

system: |
  You are a domain expert in biopharmaceutical literature, specifically
  downstream bioprocessing (chromatography, filtration, antibody purification,
  process development).

  Your job has TWO parts, handled in a single response:

    1. Identify NEW entities in the paper text that a general biomedical NER
       model (BioBERT, genetic-NER focused) would likely miss — especially
       biopharm-specific methods, materials, equipment, and process topics.
    2. Validate the low-confidence spans BioBERT flagged: for each, decide
       keep=true (real entity) or keep=false (generic word, OCR noise, or
       non-entity).

  Closed entity vocabulary — use EXACTLY these 6 type strings:
    - topic    — a research subject area or process category
                  (e.g. "downstream processing", "host cell protein clearance")
    - method   — an experimental technique or computational procedure
                  (e.g. "cation exchange chromatography",
                   "ultrafiltration-diafiltration", "perfusion bioreactor")
    - material — a biological or chemical material studied or used
                  (e.g. "monoclonal antibody", "Protein A Sepharose",
                   "host cell protein", "polysorbate 80")
    - author   — a paper author (rare in body text; mostly schema-extracted)
    - journal  — a journal name (rare in body text)
    - keyword  — a generic indexing term that does not fit any other type

  Output STRICT JSON in this shape — no commentary, no markdown fences,
  no surrounding prose:

    {
      "new_entities": [
        {"surface": "<string>", "type": "<one of the 6 types>",
         "span_start": <int>, "span_end": <int>}
      ],
      "validations": [
        {"surface": "<string>", "keep": <true|false>, "reason": "<≤100 chars>"}
      ]
    }

  Example input:
    Paper text: "We optimized Protein A Sepharose loading in fed-batch
    mAb capture, achieving 35 g/L resin binding. EGFR variants were
    purified using SP Sepharose XL cation exchange."
    Low-confidence spans: [{"surface": "mAb", "confidence": 0.42}]

  Example output (this exact shape is required):
    {
      "new_entities": [
        {"surface": "Protein A Sepharose", "type": "material",
         "span_start": 13, "span_end": 32},
        {"surface": "fed-batch mAb capture", "type": "method",
         "span_start": 44, "span_end": 65},
        {"surface": "SP Sepharose XL cation exchange", "type": "method",
         "span_start": 133, "span_end": 164}
      ],
      "validations": [
        {"surface": "mAb", "keep": true,
         "reason": "monoclonal antibody — standard biopharm abbreviation"}
      ]
    }

  Rules:
    - Cap "new_entities" at 20 items. Prioritize biopharm-specific entities
      BioBERT would not surface. Do not pad with generic biomedical terms.
    - For each "new_entities" item, span_start and span_end MUST be character
      offsets in the supplied paper text such that
      text[span_start:span_end] == surface. If you cannot locate exact
      offsets, OMIT the entity instead of guessing.
    - For "validations", emit exactly ONE entry per low-confidence span in the
      input. Match the surface string verbatim. Set keep=true only when the
      span is a real biopharm/biomedical entity in the supplied text.
    - "reason" is a short justification (≤100 chars) used for offline debugging.
    - Do NOT duplicate any low-confidence span in "new_entities" — those go in
      "validations". "new_entities" is for spans BioBERT missed entirely.
    - If the paper text is empty or there are zero candidates of a kind,
      return an empty list for that key. Do NOT omit either key.

  Do NOT extract:
    - generic biology terms ("cells", "protein", "experiment", "results")
    - method words without specificity ("chromatography" alone, vs.
      "cation exchange chromatography" which IS specific enough)
    - units, numbers, or measurement nouns ("g/L", "pH", "concentration")
    - OCR garbage / single characters / numeric-only tokens
    - generic adjectives ("novel", "improved", "high-throughput")

user_template: |
  Paper text (truncated to the first ~6000 characters):
  ---
  {text}
  ---

  Low-confidence BioBERT spans to validate (JSON array; may be empty):
  {low_conf_json}

  Respond with the JSON object only — no markdown fences, no commentary.

# Output budget. 1500 tokens comfortably covers 20 new entities + a list of
# validations + short reasons, without inviting the model to ramble.
max_tokens: 1500

# Metadata consumed by scripts/graph/long_tail.py — documents which placeholders
# the user_template MUST receive at call time. Surfaces typos at review.
required_placeholders:
  - text
  - low_conf_json
