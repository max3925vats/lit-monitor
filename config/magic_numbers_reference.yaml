# ============================================================================
# magic_numbers_reference.yaml
# ----------------------------------------------------------------------------
# DOCUMENTATION ONLY. This file is NOT read by the application. It is a hand-
# verified inventory of behaviour-affecting hardcoded numeric constants in the
# codebase, so a maintainer can see — in one place — every "magic number",
# where it lives, and what it controls.
#
# Generated: 2026-06-03, against branch fix/audit2-remediation (commit 5fca566).
# Method: read-only ground-truth sweep of scripts/ (implementation, not
# docstrings); every line number below was grep-confirmed at generation time.
# Line numbers drift as code changes — treat them as "as-of" pointers, not
# guarantees. Re-run the sweep after large refactors.
#
# Scope note: test files are excluded. HTTP status codes, array indices, and
# trivial 0/1/-1 sentinels are excluded unless they gate real behaviour.
#
# ---- Field legend ----------------------------------------------------------
#   line     : line number in `file` (as of the commit above)
#   value    : the literal currently in source
#   category : token_budget | chunk_size | threshold | cap_or_limit |
#              timeout | retry | weight | dimension | interval | other
#   does     : one-line description of what the number controls (from code)
#   tunable  : true  = a maintainer would realistically want to change this
#              false = structural/incidental; documented for completeness
#   status   : hardcoded      = literal in source, no config override
#              config_default = the fallback default for a value already
#                               overridable via a YAML key (see that section)
#   flag     : (optional) DRIFT / BUG / DEAD / DUPLICATE — see notes inline
#
# This is an inventory, not a work order. Externalizing all of these is NOT
# recommended — most are sensible constants no one will ever tune. The
# `tunable: true` + `flag:` entries are the candidates worth a closer look.
# ============================================================================


