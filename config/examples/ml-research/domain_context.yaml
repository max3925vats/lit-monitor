domain_focus: >
  Machine learning and deep learning research, with an emphasis on methods
  papers from venues such as NeurIPS, ICML, and ICLR. Core topics: transformer
  architectures and attention mechanisms, large language models and their
  fine-tuning (parameter-efficient methods, instruction tuning, RLHF and
  alignment), generative models (diffusion, autoregressive), representation
  learning, graph neural networks, and retrieval-augmented systems. The
