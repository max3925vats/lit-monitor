name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give,
        the faster it can be reproduced and fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks that trigger it.
      placeholder: |
        1. Run `lit-monitor ...`
        2. Open `/...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: >-
        Paste any error message or relevant log lines. Run `lit-monitor diagnose`
        and include its summary if it's a setup/connectivity issue. **Do not paste
        API keys or other secrets.**
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: lit-monitor version
      description: Output of `lit-monitor --version` (or the PyPI/source version).
      placeholder: "0.11.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other (note in description)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - pip / pipx / uvx (PyPI)
        - From source (install.sh / uv)
        - Other (note in description)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: My report contains no API keys, tokens, or other secrets.
          required: true
