<section class="brain-build-controls card"
  hx-get="/api/brain-build/controls" hx-trigger="every 5s" hx-swap="outerHTML">
  <h2>Controls</h2>
  {% if is_running %}
  <p class="pill warning">running — pid {{ pid }}, started {{ started_at }}</p>
  <form hx-post="/api/brain-build/stop" hx-target="#start-stop-result" hx-swap="innerHTML">
    <button type="submit" class="button danger">Stop after current paper</button>
    <p class="field-note">Sends SIGTERM; the pipeline finishes the in-flight paper
      then exits cleanly. SIGKILL fallback after 30 seconds.</p>
  </form>
  {% else %}
  <form hx-post="/api/brain-build/start"
        hx-target="#start-stop-result" hx-swap="innerHTML"
        hx-encoding="multipart/form-data">
    <div class="field">
      <label>
        <input type="checkbox" name="resume" value="true" checked>
        Resume from last state
      </label>
    </div>
    <div class="field">
      <label>Max papers
        <input type="number" name="max_papers" min="1" placeholder="(unlimited)">
      </label>
    </div>
    <div class="field">
      <label>
        <input type="checkbox" name="all_library" value="true">
        Process whole library (not just configured collection)
      </label>
    </div>
    <button type="submit" class="button">Start brain-build</button>
  </form>
  {% endif %}
  <div id="start-stop-result"></div>
</section>
