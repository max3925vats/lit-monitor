{# Partial: a single researcher row. Server-rendered for the HTMX add-row case.
   The initial-render rows are inlined in step_researchers.html. #}
<fieldset class="topics-row">
  <sl-input name="name_{{ idx }}" label="Name" value="{{ r.name }}"></sl-input>
  <sl-input name="affiliation_{{ idx }}" label="Affiliation" value="{{ r.affiliation }}"></sl-input>
  <sl-input name="orcid_{{ idx }}" label="ORCID" value="{{ r.orcid }}" placeholder="0000-0000-0000-0000"></sl-input>
  <sl-input name="scopus_id_{{ idx }}" label="Scopus ID" value="{{ r.scopus_id }}"></sl-input>
  <sl-textarea name="notes_{{ idx }}" rows="2" label="Notes" value="{{ r.notes }}"></sl-textarea>
  <sl-button variant="danger" size="small"
    onclick="this.closest('fieldset').remove()">Remove</sl-button>
</fieldset>
