{% extends "setup/_base.html" %}
{% block step_content %}
<h1>Step 2 — Paths</h1>
<p>Where your Obsidian vault lives and which Zotero collection to monitor. Stored at <code>config/paths.yaml</code>.</p>

<form
  class="setup-form"
  hx-post="/setup/api/paths"
  hx-target="#result"
  hx-swap="innerHTML"
>
  <div class="field-group">
    <label class="sl-label">Obsidian vault path</label>
    <div class="input-row">
      <!-- id="vault_path" kept — the fs-dialog picker does:
           document.getElementById('vault_path').value = chosenPath
           sl-input supports the .value setter identically to <input>. -->
      <sl-input
        id="vault_path"
        name="vault_path"
        value="{{ vault_path }}"
        required
        style="flex: 1"
      ></sl-input>
      <button type="button" class="button"
        hx-get="/setup/fs-modal?path={{ home | urlencode }}"
        hx-target="#fs-modal" hx-swap="innerHTML">
        Browse…
      </button>
    </div>
  </div>

  <div class="field-group">
    <label class="sl-label">Zotero collection name</label>
    <!-- Options are loaded via HTMX from /setup/api/collections-options,
         which emits <sl-option> elements after the Task 3 endpoint update. -->
    <sl-select name="collection_name" id="collection-select"
      hx-get="/setup/api/collections-options?current={{ collection_name | urlencode }}"
      hx-trigger="load"
      hx-target="this" hx-swap="innerHTML">
      <sl-option value="{{ collection_name }}">Loading collections…</sl-option>
    </sl-select>
    <noscript>(Enter manually:) <input type="text" name="collection_name" value="{{ collection_name }}"></noscript>
  </div>

  <sl-input
    name="library_id"
    label="Zotero library ID"
    value="{{ library_id }}"
    required
  ></sl-input>

  <sl-select name="library_type" label="Library type">
    <sl-option value="user" {% if library_type == "user" %}selected{% endif %}>user</sl-option>
    <sl-option value="group" {% if library_type == "group" %}selected{% endif %}>group</sl-option>
  </sl-select>

  <sl-input
    name="local_storage_path"
    label="Zotero local storage path"
    help-text="Optional — path to your local Zotero storage directory."
    value="{{ local_storage_path }}"
  ></sl-input>

  <sl-button variant="primary" type="submit">Save</sl-button>
</form>

<div id="result" aria-live="polite"></div>
<div id="fs-modal"></div>

<p><a href="/setup">← Back to setup overview</a></p>
{% endblock %}
