{% if errors %}
<div class="card danger">
  <h3>Could not save</h3>
  <ul>
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>
</div>
{% else %}
<div class="card success">
  <h3>Saved ✓</h3>
  <p>paths.yaml updated.</p>
  <p class="setup-result-actions">
    <a href="/setup" class="button">← Back to all steps</a>
    <a href="/setup/step-3" class="button">Continue to step 3 →</a>
  </p>
</div>
{% endif %}
